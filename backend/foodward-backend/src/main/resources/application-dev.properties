# --- dev profile: H2 in-memory, zero setup, schema auto-created ---
# Active by default. Data does not persist between restarts — fine for
# local iteration, not for anything you need to keep.

spring.datasource.url=jdbc:h2:mem:foodward;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=false
