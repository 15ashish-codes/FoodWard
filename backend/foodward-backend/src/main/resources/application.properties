spring.application.name=foodward-backend
server.port=8080

# Which profile runs by default. Override with:
#   mvn spring-boot:run -Dspring-boot.run.profiles=postgres
#   or: export SPRING_PROFILES_ACTIVE=postgres
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- JWT ---
# In production, override via env var: JWT_SECRET (min 32 chars, base64-safe)
jwt.secret=${JWT_SECRET:c2VjdXJlLWZvb2R3YXJkLWp3dC1zaWduaW5nLWtleS1jaGFuZ2UtbWUtaW4tcHJvZHVjdGlvbg==}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- CORS: the Vite dev server origin ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# --- Seed data on startup (admin + demo accounts) ---
app.seed.enabled=${SEED_ENABLED:true}
