# --- postgres profile: real Postgres database, schema managed by Flyway ---
# Activate with: mvn spring-boot:run -Dspring-boot.run.profiles=postgres
# or: export SPRING_PROFILES_ACTIVE=postgres
#
# All connection details are environment-driven with sane local defaults
# matching docker-compose.yml, so this works out of the box against the
# container started by `docker compose up -d`.

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:foodward}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:foodward}
spring.datasource.password=${DB_PASSWORD:foodward_local_dev}

# Flyway owns the schema here — Hibernate only validates that entities
# match what Flyway created. Never use ddl-auto=update against a real DB.
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.h2.console.enabled=false
