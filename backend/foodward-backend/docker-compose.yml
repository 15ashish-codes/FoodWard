version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: foodward-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: foodward
      POSTGRES_USER: foodward
      POSTGRES_PASSWORD: foodward_local_dev
    ports:
      - "5432:5432"
    volumes:
      - foodward_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodward -d foodward"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  foodward_pgdata:
